- id: uc2_exact_duplicate_invoice
  use_case: UC2
  prompt: "Scan for exact duplicate vendor invoices in Meridian Bank N.A. (Company 1000). For each pair found, report the vendor ID, external invoice reference, amounts, which document is open (block payment) vs paid (request refund), and calculate the total recoverable cash amount."
  expected:
    vendor_id: "V000123"
    reference: "INV-2026-0891"
    recoverable_amount: 45000.00
    duplicate_count: 1
  forbidden:
    decoy_documents: ["0000002001"]
  allowed_tools:
    - find_duplicate_invoices
    - get_document
    - list_open_items
    - search_documents
  max_tool_calls: 8

- id: uc2_fuzzy_duplicate_typo
  use_case: UC2
  prompt: "Find candidate duplicate invoices where a reference number has a minor typographical difference or slight amount discrepancy within 1%."
  expected:
    fuzzy_pairs_found: true
    false_positives: 0
  forbidden:
    decoy_documents: ["0000002001"]
  allowed_tools:
    - find_duplicate_invoices
    - get_document
  max_tool_calls: 6

- id: uc2_decoy_vendor_isolation
  use_case: UC2
  prompt: "Check whether invoice reference 'INV-SHARED-99' posted under two different vendors represents a duplicate payment risk."
  expected:
    is_duplicate: false
    reason: "Different vendor IDs; invoices represent independent transactions from distinct suppliers"
  forbidden:
    terms: ["recoverable amount", "block payment"]
  allowed_tools:
    - find_duplicate_invoices
    - get_document
    - search_documents
  max_tool_calls: 6

- id: uc2_vendor_open_item_aging
  use_case: UC2
  prompt: "List all open vendor items for Meridian Bank N.A. as of 2026-10-05 and summarize total exposure and aging breakdown."
  expected:
    open_items_count: 45
    aging_basis: "posting_date"
  forbidden:
    terms: ["due_date"]
  allowed_tools:
    - list_open_items
  max_tool_calls: 4

- id: uc2_payables_exposure_review
  use_case: UC2
  prompt: "Identify any vendors that have both duplicate invoices and multiple outstanding open items, and compile an AP risk summary."
  expected:
    affected_vendors: ["V000123"]
    total_exposure_stated: true
  forbidden:
    terms: ["deleted"]
  allowed_tools:
    - find_duplicate_invoices
    - list_open_items
    - get_document
  max_tool_calls: 8
